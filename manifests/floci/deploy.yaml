---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: floci-deploy
  labels:
    app: floci
spec:
  replicas: 1
  selector:
    matchLabels:
      app: floci-pod
  template:
    metadata:
      labels:
        app: floci-pod
    spec:
      containers:
        - name: floci-cont
          image: floci/floci:latest
          ports:
            - containerPort: 4566
          env:
            - name: FLOCI_HOSTNAME
              value: floci-service
