clickhouse:
  cluster:
    storage:
      size: 100Gi
    resources:
      limits:
        cpu: "2"
        memory: "8Gi"
      requests:
        cpu: "2"
        memory: "8Gi"
  keeper:
    storage:
      size: 20Gi
    resources:
      limits:
        cpu: "1"
        memory: "1Gi"
      requests:
        cpu: "500m"
        memory: "512Mi"

redis:
  resources:
    limits:
      cpu: "1"
      memory: "1.5Gi"
    requests:
      cpu: "1"
      memory: "1.5Gi"

s3:
  allInOne:
    resources:
      limits:
        cpu: "2"
        memory: "4Gi"
      requests:
        cpu: "2"
        memory: "4Gi"
